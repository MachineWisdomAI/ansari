name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping shape Ansari. The most useful requests start from the
        problem rather than a specific solution — tell us what you were trying to do.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the need or frustration itself, not only the change you have in mind.
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who does this affect?
      description: For example — all users, people asking in a particular language, self-hosters, API consumers.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If you have one in mind. It's fine to leave this blank.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried or thought about, and why they fall short.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: >-
        For features touching Islamic content (answers, citations, sources), please note the
        sourcing and accuracy considerations.
    validations:
      required: false
